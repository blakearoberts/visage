name: Auto-Merge

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - 'dependabot/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          pr_url="$(
            gh pr list \
              --base main \
              --head "$HEAD_BRANCH" \
              --json url \
              --jq '.[0].url // empty'
          )"

          if [ -z "$pr_url" ]; then
            echo "No open pull request found for $HEAD_BRANCH."
            exit 0
          fi

          gh pr merge --auto --merge --delete-branch "$pr_url"

  update:
    name: Update Dependabot Branches
    needs: enable
    if: >-
      always() &&
      (github.event_name == 'push' || needs.enable.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: visage-dependabot-update
      cancel-in-progress: false
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update branches
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          pr_numbers="$(
            gh pr list \
              --base main \
              --author 'dependabot[bot]' \
              --limit 100 \
              --json number,headRefName,autoMergeRequest \
              --jq '.[] | select(.autoMergeRequest != null and (.headRefName | startswith("dependabot/"))) | .number'
          )"

          for pr_number in $pr_numbers; do
            head_sha="$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')"
            behind_by="$(gh api "repos/$GH_REPO/compare/main...$head_sha" --jq '.behind_by')"
            if [ "$behind_by" -gt 0 ]; then
              gh pr update-branch "$pr_number"
            fi
          done
