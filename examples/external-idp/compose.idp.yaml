services:
  idp:
    extends:
      file: ../../packages/visage/docker-compose.images.yml
      service: dex
    command: ['dex', 'serve', '/etc/dex/dex.yml']
    environment:
      DEX_SESSIONS_ENABLED: 'true'
    ports:
      - '5557:5557'
    volumes:
      - './dex.yml:/etc/dex/dex.yml:ro'
networks:
  default:
    name: external-idp
