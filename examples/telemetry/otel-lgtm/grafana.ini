[paths]
provisioning = /otel-lgtm/visage/provisioning
permitted_provisioning_paths = /otel-lgtm/visage/dashboards

[server]
root_url = https://g.localhost:9001/

[security]
cookie_secure = true

[users]
auto_assign_org_role = Editor

[auth]
disable_login_form = true

[auth.anonymous]
enabled = false

[auth.generic_oauth]
enabled = true
auto_login = true
client_id = grafana
client_secret = $__file{/run/secrets/VISAGE_GRAFANA_CLIENT_SECRET}
scopes = openid email offline_access
auth_url = https://idp.localhost:9001/auth
token_url = https://idp.localhost:9001/token
api_url = https://idp.localhost:9001/userinfo
use_pkce = true
use_refresh_token = true
tls_client_ca = /etc/ssl/certs/visage.pem
