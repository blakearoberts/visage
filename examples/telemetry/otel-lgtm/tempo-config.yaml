server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: '127.0.0.1:4418'

live_store:
  max_trace_idle: 1s
  max_block_duration: 1s
  flush_check_period: 1s
  wal:
    path: /data/tempo/wal

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    local:
      path: /data/tempo/blocks

metrics_generator:
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs]
