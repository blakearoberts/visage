apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oauth2-proxy-operator.fullname" . }}
  labels:
    {{- include "oauth2-proxy-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oauth2-proxy-operator.fullname" . }}
  labels:
    {{- include "oauth2-proxy-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ['gateway.networking.k8s.io']
    resources: ['httproutes']
    verbs: ['get', 'list', 'watch', 'update', 'patch']
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'create', 'update', 'delete']
  - apiGroups: ['']
    resources: ['secrets', 'services']
    verbs: ['get', 'create', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oauth2-proxy-operator.fullname" . }}
  labels:
    {{- include "oauth2-proxy-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oauth2-proxy-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oauth2-proxy-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oauth2-proxy-operator.fullname" . }}
  labels:
    {{- include "oauth2-proxy-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "oauth2-proxy-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oauth2-proxy-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "oauth2-proxy-operator.fullname" . }}
      containers:
        - name: operator
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: OAUTH2_PROXY_IMAGE
              value: {{ required "oauth2Proxy.image is required" .Values.oauth2Proxy.image | quote }}
      resources:
