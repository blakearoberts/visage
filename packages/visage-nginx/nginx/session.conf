set $public_origin       https://localhost;
set $session_cookie_name __Host-sess;
set $oauth2_proxy_origin http://localhost:4180;
set $sign_out_redirect   "";

js_var $visage_session_cookie;

location = /session/login {
    proxy_pass $oauth2_proxy_origin/oauth2/start$is_args$args;
}

location = /session/callback {
    proxy_pass $oauth2_proxy_origin/oauth2/callback$is_args$args;
}

location = /session/logout {
    js_access        visage.sign_out;
    proxy_set_header Cookie $visage_session_cookie;
    proxy_set_header X-Auth-Request-Redirect $sign_out_redirect;
    proxy_pass       $oauth2_proxy_origin/oauth2/sign_out$is_args$args;
}
