services:
  dex:
    ports: ['127.0.0.1::5556']
    # v2.46.1 timed out during repeated refreshes in the multi-upstream test.
    image: ghcr.io/dexidp/dex@sha256:95d0bdf941d112a1e26d52b457e99158d6bef0a505106856efc2ab51b75c0dcb
    command: [dex, serve, /etc/dex/test.yaml]
    volumes:
      - ./dex.yaml:/etc/dex/test.yaml:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:5556/healthz]
      interval: 1s
      timeout: 1s
      retries: 30
  sessions:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    command: [--config=/etc/oauth2-proxy/test.toml]
    volumes:
      - ./oauth2-proxy.toml:/etc/oauth2-proxy/test.toml:ro
    depends_on:
      dex:
        condition: service_healthy
  edge:
    ports: ['127.0.0.1::80']
    image: nginx:1.31.8-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../dist:/etc/nginx/visage:ro
    secrets: [VISAGE_APP_CLIENT_SECRET]
    depends_on: [sessions]
secrets:
  VISAGE_APP_CLIENT_SECRET:
    environment: VISAGE_TEST_SECRET
