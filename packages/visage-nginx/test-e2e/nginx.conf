load_module modules/ngx_http_js_module.so;
events {}
http {
    js_engine qjs;
    js_import visage from /etc/nginx/visage/index.js;
    resolver 127.0.0.11 ipv6=off;

    upstream resource { server 127.0.0.1:8080; }
    upstream exchange { server 127.0.0.1:8080; }

    server {
        listen 127.0.0.1:8080;
        return 200 "$http_authorization\n$http_x_auth_request_user\n$http_x_auth_request_email\n";
    }

    server {
        listen 80;
        include /etc/nginx/visage/session.conf;
        set $public_origin http://localhost;
        set $upstream_origin http://resource;
        set $visage_exchange id;
        set $visage_forward access;
        set $exchange_endpoint http://dex:5556/token;
        set $exchange_connector session-issuer;

        location / {
            js_access visage;
            proxy_set_header Cookie "";
            proxy_set_header Authorization $visage_authorization;
            proxy_set_header X-Auth-Request-User $visage_user;
            proxy_set_header X-Auth-Request-Email $visage_email;
            proxy_pass $upstream_origin;

            location /profile {
                js_access visage.session;
                set $visage_forward id;
                proxy_pass $upstream_origin;
            }

            location /exchange {
                js_access visage.exchange;
                set $visage_exchange access;
                set $visage_forward id;
                set $exchange_connector access-issuer;
                set $upstream_origin http://exchange;
                proxy_pass $upstream_origin;
            }
        }
    }
}
