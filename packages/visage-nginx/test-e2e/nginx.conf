load_module modules/ngx_http_js_module.so;
events {}
http {
    js_engine qjs;
    js_import visage from /etc/nginx/visage/index.js;
    resolver 127.0.0.11 ipv6=off;

    map "$visage_authorization$visage_user$visage_email" $auth_outputs {
        "" empty;
        default populated;
    }

    upstream resource { server 127.0.0.1:8080; }
    upstream reports { server 127.0.0.1:8081; }
    upstream untrusted { server 127.0.0.1:8080; }

    server {
        listen 80;
        set $public_origin http://edge;
        set $upstream_origin http://resource;
        set $visage_session on;
        set $visage_exchange id;
        set $visage_forward access;
        set $session_endpoint http://sessions:4180/oauth/auth;
        set $exchange_endpoint http://dex:5556/token;
        set $exchange_connector session-issuer;

        js_var $visage_authorization;
        js_var $visage_user;
        js_var $visage_email;

        location = /oauth/auth {
            return 404;
        }

        location /oauth/ {
            proxy_set_header Cookie $http_cookie;
            proxy_pass http://sessions:4180;
        }

        proxy_set_header Cookie "";
        proxy_set_header Authorization $visage_authorization;
        proxy_set_header X-Auth-Request-User $visage_user;
        proxy_set_header X-Auth-Request-Email $visage_email;
        location / {
            js_access visage;
            proxy_pass $upstream_origin;

            location = /public {
                set $visage_session off;
                set $visage_exchange off;
                proxy_pass $upstream_origin;
            }
            location = /session {
                set $visage_forward id;
                set $visage_exchange off;
                proxy_pass $upstream_origin;
            }
            location = /identity {
                set $visage_exchange off;
                set $visage_forward off;
                proxy_pass $upstream_origin;
            }
            location = /unmapped {
                set $visage_session "";
                proxy_pass $upstream_origin;
            }
            location = /exchange-without-session {
                set $visage_session off;
                proxy_pass $upstream_origin;
            }
            location /reports/ {
                set $visage_exchange access;
                set $visage_forward id;
                set $exchange_connector access-issuer;
                set $upstream_origin http://reports;
                proxy_pass $upstream_origin;
            }
            location = /denied {
                add_header X-Test-Auth-Outputs $auth_outputs always;
                set $upstream_origin http://untrusted;
                proxy_pass $upstream_origin;
            }
        }
    }
    server {
        listen 127.0.0.1:8080;
        listen 127.0.0.1:8081;
        add_header X-Upstream $server_port;
        return 200 "$http_authorization\n$http_x_auth_request_user\n$http_x_auth_request_email\n";
    }
}
