receivers:
  fluentforward:
    endpoint: 0.0.0.0:24224
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: oauth2-proxy
          scrape_interval: 10s
          static_configs:
            - targets: [nginx:4181]

extensions:
  health_check:
    endpoint: 127.0.0.1:13133
    path: /ready

processors:
  transform/redaction:
    trace_statements:
      - context: span
        conditions:
          - resource.attributes["service.name"] == "nginx"
        statements:
          - 'replace_pattern(span.attributes["http.target"], "(?i)\\b(code|state|id_token_hint|hmac|token|error|error_description)=[^&\\s\"<>]*", "$$1=****") where span.attributes["http.target"] != nil'
    log_statements:
      - context: log
        conditions:
          - log.attributes["fluent.tag"] != nil and IsMatch(log.attributes["fluent.tag"], "/nginx[|]")
        statements:
          - 'replace_pattern(log.body, "(?i)\\b(code|state|id_token_hint|hmac|token|error|error_description)=[^&\\s\"<>]*", "$$1=****") where IsString(log.body)'
      - context: log
        conditions:
          - log.attributes["fluent.tag"] != nil and IsMatch(log.attributes["fluent.tag"], "/oauth2_proxy[|]")
        statements:
          - 'replace_pattern(log.body, "(?i)\\b(code|state|error|error_description)=[^&\\s\"<>]*", "$$1=****") where IsString(log.body)'
          - 'replace_pattern(log.body, "Error while parsing OAuth2 callback:.*", "Error while parsing OAuth2 callback: ****") where IsString(log.body)'
  transform/container_logs:
    log_statements:
      - context: log
        conditions:
          - log.attributes["fluent.tag"] != nil
        statements:
          - set(cache["fluent"], ExtractPatterns(log.attributes["fluent.tag"], "^(?P<namespace>[^|]+)/(?P<name>[^/|]+)[|](?P<image_name>[^@]+?)(?::(?P<image_tag>[^/:@]+))?(?:@[^@]+)?$"))
          - set(log.attributes["service.name"], cache["fluent"]["name"])
          - set(log.attributes["service.namespace"], cache["fluent"]["namespace"])
          - set(log.attributes["container.image.name"], cache["fluent"]["image_name"])
          - set(log.attributes["container.image.tag"], cache["fluent"]["image_tag"]) where cache["fluent"]["image_tag"] != ""
          - set(log.attributes["container.name"], log.attributes["container_name"])
          - set(log.attributes["container.id"], log.attributes["container_id"])
          - delete_key(log.attributes, "container_name")
          - delete_key(log.attributes, "container_id")
          - replace_pattern(log.attributes["container.name"], "^/", "") where IsString(log.attributes["container.name"])
          - delete_key(log.attributes, "fluent.tag")
  groupbyattrs/container_logs:
    keys:
      - service.name
      - service.namespace
      - container.name
      - container.id
      - container.image.name
      - container.image.tag
  batch:
  transform/nginx_http_server_spans:
    trace_statements:
      - context: span
        conditions:
          - span.kind == SPAN_KIND_SERVER and span.attributes["http.method"] != nil
        statements:
          - set(span.attributes["http.request.method"], span.attributes["http.method"])
          - set(span.attributes["url.path"], span.attributes["http.target"])
          - replace_pattern(span.attributes["url.path"], "\\?.*", "")
          - set(span.attributes["url.query"], span.attributes["http.target"]) where IsMatch(span.attributes["http.target"], "\\?")
          - replace_pattern(span.attributes["url.query"], "^[^?]*\\?", "") where span.attributes["url.query"] != nil
          - set(span.attributes["url.scheme"], span.attributes["http.scheme"])
          - set(span.attributes["network.protocol.version"], span.attributes["http.flavor"])
          - set(span.attributes["network.protocol.version"], "2") where span.attributes["http.flavor"] == "2.0"
          - set(span.attributes["network.protocol.version"], "3") where span.attributes["http.flavor"] == "3.0"
          - set(span.attributes["user_agent.original"], span.attributes["http.user_agent"])
          - set(span.attributes["http.request.body.size"], span.attributes["http.request_content_length"])
          - set(span.attributes["http.response.body.size"], span.attributes["http.response_content_length"])
          - set(span.attributes["server.address"], span.attributes["net.host.name"])
          - set(span.attributes["server.port"], span.attributes["net.host.port"])
          - set(span.attributes["client.address"], span.attributes["net.sock.peer.addr"])
          - set(span.attributes["network.peer.address"], span.attributes["net.sock.peer.addr"])
          - set(span.attributes["network.peer.port"], span.attributes["net.sock.peer.port"])
          - set(span.attributes["http.response.status_code"], span.attributes["http.status_code"])
          - set(span.attributes["error.type"], String(span.attributes["http.status_code"])) where span.attributes["http.status_code"] >= 500
          - set(span.status.code, STATUS_CODE_ERROR) where span.attributes["http.status_code"] >= 500
          - delete_key(span.attributes, "http.target")
          - delete_key(span.attributes, "http.scheme")
          - delete_key(span.attributes, "http.flavor")
          - delete_key(span.attributes, "http.user_agent")
          - delete_key(span.attributes, "http.request_content_length")
          - delete_key(span.attributes, "http.response_content_length")
          - delete_key(span.attributes, "net.host.name")
          - delete_key(span.attributes, "net.host.port")
          - delete_key(span.attributes, "net.sock.peer.addr")
          - delete_key(span.attributes, "net.sock.peer.port")
          - delete_key(span.attributes, "http.method")
          - delete_key(span.attributes, "http.status_code")

connectors:
  span_metrics:
    metrics_flush_interval: 10s
    namespace: http.server.request
    histogram:
      unit: s
      explicit:
        buckets:
          [
            5ms,
            10ms,
            25ms,
            50ms,
            75ms,
            100ms,
            250ms,
            500ms,
            750ms,
            1s,
            2.5s,
            5s,
            7.5s,
            10s,
          ]
    dimensions:
      - name: http.request.method
      - name: url.scheme
      - name: error.type
      - name: http.response.status_code
      - name: network.protocol.version
      - name: server.address
      - name: server.port
    exclude_dimensions: [span.name, span.kind, status.code]

exporters:
  otlp_grpc:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [transform/redaction, transform/nginx_http_server_spans, batch]
      exporters: [otlp_grpc, span_metrics]
    metrics:
      receivers: [otlp, prometheus, span_metrics]
      processors: [batch]
      exporters: [otlp_grpc]
    logs:
      receivers: [otlp, fluentforward]
      processors:
        - transform/redaction
        - transform/container_logs
        - groupbyattrs/container_logs
        - batch
      exporters: [otlp_grpc]
